<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title>
  <link rel="icon" href="https://google.com">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #202124;
      color: #e8eaed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
    }

    .logo {
      font-size: 4rem;
      font-weight: bold;
      margin-bottom: 28px;
      letter-spacing: -1px;
      user-select: none;
    }

    .logo span:nth-child(1) { color: #4285f4; }
    .logo span:nth-child(2) { color: #ea4335; }
    .logo span:nth-child(3) { color: #fbbc05; }
    .logo span:nth-child(4) { color: #4285f4; }
    .logo span:nth-child(5) { color: #34a853; }
    .logo span:nth-child(6) { color: #ea4335; }

    .search-box {
      width: 100%;
      max-width: 580px;
      display: flex;
      align-items: center;
      background: #303134;
      border: 1px solid #5f6368;
      border-radius: 24px;
      padding: 10px 18px;
      transition: background 0.2s, box-shadow 0.2s;
    }

    .search-box:hover, .search-box:focus-within {
      background: #3c4043;
      box-shadow: 0 1px 6px rgba(0,0,0,0.4);
      border-color: transparent;
    }

    input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e8eaed;
      font-size: 16px;
    }

    .buttons {
      margin-top: 26px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background-color: #303134;
      border: 1px solid #303134;
      border-radius: 4px;
      color: #e8eaed;
      font-size: 14px;
      padding: 10px 18px;
      cursor: pointer;
    }

    button:hover {
      border: 1px solid #5f6368;
      background-color: #3c4043;
    }
  </style>
</head>
<body>

  <div class="logo">
    <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>

  <form class="search-box" onsubmit="handleLaunch(event, false)">
    <input type="text" id="queryInput" placeholder="Search Google or type a URL" autofocus>
  </form>

  <div class="buttons">
    <button type="button" onclick="handleLaunch(event, false)">Google Search</button>
    <button type="button" onclick="handleLaunch(event, true)">Open in New Tab</button>
    <button type="button" id="blankBtn" onclick="openInAboutBlank()">Open in about:blank</button>
  </div>

  <script>
    const SUFFIX = "/?://blooket.com";

    // Hide the about:blank button if we are already inside an about:blank window
    if (window.location.href === "about:blank") {
      const btn = document.getElementById("blankBtn");
      if (btn) btn.style.display = "none";
    }

    function buildDestination(rawInput) {
      let text = rawInput.trim();
      if (!text) return "";

      const isUrl = !text.includes(" ") && text.includes(".");

      if (isUrl) {
        if (!text.startsWith("http://") && !text.startsWith("https://")) {
          text = "https://" + text;
        }
        text = text.replace(/\/+$/, "");
        return text + SUFFIX;
      } else {
        const encoded = encodeURIComponent(text);
        return "https://google.com" + encoded + SUFFIX;
      }
    }

    function handleLaunch(event, newTab) {
      event.preventDefault();
      const input = document.getElementById("queryInput").value;
      const finalUrl = buildDestination(input);
      if (!finalUrl) return;

      if (newTab) {
        window.open(finalUrl, "_blank");
      } else {
        window.location.href = finalUrl;
      }
    }

    function openInAboutBlank() {
      const win = window.open("about:blank", "_blank");
      if (!win) {
        alert("Pop-up blocked! Allow pop-ups in the address bar and try again.");
        return;
      }
      // Clone the full HTML of this page into the new about:blank tab
      const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      win.document.open();
      win.document.write(htmlContent);
      win.document.close();
    }
  </script>

</body>
</html>
