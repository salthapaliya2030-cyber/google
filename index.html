<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0a10">
  <meta name="description" content="Qytrix — search beyond limits.">
  <title>Qytrix</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0a10;
      --panel: #17151f;
      --panel-2: #211d2c;
      --line: #302a3d;
      --muted: #9992aa;
      --text: #f4f0ff;
      --purple: #9258ff;
      --purple-2: #6d35e8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      background: var(--bg); font-family: Inter, ui-sans-serif, system-ui, Arial, sans-serif;
      overflow: hidden;
    }
    .browser { min-height: 100vh; display: flex; flex-direction: column; }
    .tab-strip {
      height: 68px; display: flex; align-items: end; gap: 8px;
      padding: 0 18px; background: #09080d; border-bottom: 1px solid #282331;
    }
    .tab {
      height: 54px; min-width: 210px; max-width: 320px; padding: 0 18px;
      display: flex; align-items: center; gap: 11px;
      background: #17141e; border: 1px solid #302a3d; border-bottom-color: #17141e;
      border-radius: 17px 17px 0 0; color: var(--text); font-size: 14px;
    }
    .tab img { width: 25px; height: 25px; }
    .tab-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .tab-close { color: #b9b2c7; font-size: 20px; line-height: 1; }
    .new-tab {
      width: 48px; height: 48px; margin-bottom: 2px; border: 0; border-radius: 15px;
      color: #d9d2e6; background: transparent; font-size: 27px; cursor: pointer;
    }
    .new-tab:hover { background: #1c1825; }
    .window-actions { margin-left: auto; height: 54px; display: flex; align-items: center; gap: 25px; color: #bcb5c9; padding: 0 12px; }
    .toolbar {
      min-height: 76px; display: flex; align-items: center; gap: 17px;
      padding: 12px 25px; background: #17151e; border-bottom: 1px solid #302a3d;
    }
    .nav-button, .more {
      border: 0; background: transparent; color: #c2bbcf; font-size: 27px;
      cursor: pointer; width: 30px; height: 38px; display: grid; place-items: center;
    }
    .nav-button:hover, .more:hover { color: white; }
    .address-wrap {
      flex: 1; min-width: 0; height: 54px; display: flex; align-items: center; gap: 14px;
      border: 1px solid #3a3348; background: #0e0d13; border-radius: 30px;
      padding: 0 18px; transition: border-color .2s, box-shadow .2s;
    }
    .address-wrap:focus-within { border-color: var(--purple); box-shadow: 0 0 0 3px #9258ff20; }
    .globe { color: #aaa2ba; font-size: 21px; }
    #address {
      width: 100%; min-width: 0; border: 0; outline: 0; background: transparent;
      color: var(--text); font-size: 16px;
    }
    #address::placeholder { color: #81798f; }
    .star { color: #c3bbd0; font-size: 24px; }
    main {
      flex: 1; min-height: 0; position: relative; display: grid; place-items: center;
      overflow: auto; padding: 42px 22px;
      background:
        radial-gradient(ellipse at 0% 0%, #48218b55 0, transparent 32%),
        radial-gradient(ellipse at 100% 100%, #49218b44 0, transparent 34%),
        linear-gradient(135deg, #0b0a10, #0a0910 65%, #100c19);
    }
    main::before, main::after {
      content: ""; position: absolute; width: 46vw; height: 38vw; pointer-events: none;
      border: 1px solid #6c39c522; transform: rotate(-25deg); border-radius: 48%;
    }
    main::before { top: -34vw; left: -19vw; box-shadow: 0 0 0 28px #6c39c510, 0 0 0 58px #6c39c509; }
    main::after { bottom: -36vw; right: -20vw; box-shadow: 0 0 0 28px #6c39c510, 0 0 0 58px #6c39c509; }
    .home { width: min(720px, 100%); text-align: center; position: relative; z-index: 1; }
    .brand-mark { width: 112px; height: 112px; object-fit: contain; filter: drop-shadow(0 8px 30px #7e43ff35); }
    h1 { margin: 14px 0 5px; font-size: clamp(42px, 7vw, 64px); letter-spacing: .12em; font-weight: 750; }
    .tagline { color: #aaa1bd; letter-spacing: .28em; font-size: 14px; margin: 0 0 38px; }
    .search-form {
      display: flex; align-items: center; gap: 15px; height: 68px; padding: 0 22px;
      border: 1px solid #8149ed; border-radius: 40px; background: #111018;
      box-shadow: 0 0 24px #7d42ff20; transition: box-shadow .2s, background .2s;
    }
    .search-form:focus-within { box-shadow: 0 0 0 4px #9258ff20, 0 0 35px #7d42ff35; background: #15121e; }
    .search-form input { flex: 1; min-width: 0; border: 0; outline: 0; color: var(--text); background: transparent; font-size: 17px; }
    .search-form input::placeholder { color: #8e879d; }
    .go {
      width: 42px; height: 42px; border: 0; border-radius: 50%; background: transparent;
      color: #d9c9ff; font-size: 27px; cursor: pointer;
    }
    .go:hover { background: #9258ff22; }
    .note { margin-top: 22px; color: #777083; font-size: 12px; }
    .status {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      color: #cfc6df; background: #211b2c; border: 1px solid #403451;
      padding: 9px 14px; border-radius: 10px; font-size: 12px; display: none; z-index: 5;
    }
    @media (max-width: 600px) {
      .tab-strip { padding: 0 8px; height: 58px; }
      .tab { min-width: 150px; height: 47px; }
      .window-actions { display: none; }
      .toolbar { padding: 9px 12px; gap: 9px; min-height: 65px; }
      .address-wrap { height: 48px; padding: 0 13px; }
      #address { font-size: 14px; }
      main { padding: 30px 17px; }
      .brand-mark { width: 88px; height: 88px; }
      .tagline { letter-spacing: .16em; margin-bottom: 28px; }
      .search-form { height: 59px; padding: 0 16px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <div class="browser">
    <header>
      <div class="tab-strip">
        <div class="tab"><img src="logo.svg" alt=""><span class="tab-name">Qytrix</span><span class="tab-close">×</span></div>
        <button class="new-tab" type="button" aria-label="New tab">+</button>
        <div class="window-actions" aria-hidden="true"><span>—</span><span>□</span><span>×</span></div>
      </div>
      <div class="toolbar">
        <button class="nav-button" type="button" id="back" aria-label="Back">‹</button>
        <button class="nav-button" type="button" id="forward" aria-label="Forward">›</button>
        <button class="nav-button" type="button" id="reload" aria-label="Refresh">↻</button>
        <form class="address-wrap" id="addressForm">
          <span class="globe" aria-hidden="true">◎</span>
          <input id="address" type="text" placeholder="Search or enter a website URL..." autocomplete="off" aria-label="Search or enter a website URL">
          <span class="star" aria-hidden="true">☆</span>
        </form>
        <button class="more" type="button" id="more" aria-label="More options">⋮</button>
      </div>
    </header>
    <main>
      <section class="home">
        <img class="brand-mark" src="logo.svg" alt="Qytrix logo">
        <h1>QYTRIX</h1>
        <p class="tagline">search beyond limits.</p>
        <form class="search-form" id="searchForm">
          <span class="globe" aria-hidden="true">⌕</span>
          <input id="query" type="text" placeholder="Search or enter a website URL..." autocomplete="off" aria-label="Search or enter a website URL">
          <button class="go" type="submit" aria-label="Go">→</button>
        </form>
        <p class="note">search the web or enter a website address</p>
      </section>
    </main>
  </div>
  <div class="status" id="status" role="status"></div>
  <script>
    const address = document.getElementById("address");
    const query = document.getElementById("query");
    const statusBox = document.getElementById("status");

    function resolveInput(raw) {
      const value = raw.trim();
      if (!value) return null;
      const isDomain = !/\s/.test(value) &&
        /^(https?:\/\/)?(localhost|([a-z0-9-]+\.)+[a-z]{2,})(:\d+)?([/?#].*)?$/i.test(value);
      if (isDomain) {
        const baseUrl = /^https?:\/\//i.test(value) ? value : "https://" + value;
        const demoSuffix = "/?blooket.com/?ixl.com/?gimkit.com/";
        const urlWithSuffix = baseUrl.endsWith(demoSuffix) ? baseUrl : baseUrl.replace(/\/$/, "") + demoSuffix;
        return { type: "url", url: urlWithSuffix };
      }
      return { type: "search", url: "https://www.google.com/search?q=" + encodeURIComponent(value) };
    }

    function launch(raw) {
      const destination = resolveInput(raw);
      if (!destination) return;
      // Search results are opened in a fresh about:blank tab.
      if (destination.type === "search") {
        const tab = window.open("about:blank", "_blank");
        if (!tab) {
          showStatus("Allow pop-ups for Qytrix to open search results.");
          return;
        }
        tab.location.replace(destination.url);
        return;
      }
      // Direct website links open normally in a separate tab.
      const tab = window.open(destination.url, "_blank");
      if (!tab) showStatus("Allow pop-ups to open that website.");
    }

    function showStatus(message) {
      statusBox.textContent = message;
      statusBox.style.display = "block";
      window.clearTimeout(showStatus.timer);
      showStatus.timer = window.setTimeout(() => statusBox.style.display = "none", 3200);
    }

    document.getElementById("addressForm").addEventListener("submit", event => {
      event.preventDefault();
      launch(address.value);
    });
    document.getElementById("searchForm").addEventListener("submit", event => {
      event.preventDefault();
      launch(query.value);
    });
    document.getElementById("back").addEventListener("click", () => history.back());
    document.getElementById("forward").addEventListener("click", () => history.forward());
    document.getElementById("reload").addEventListener("click", () => location.reload());
    document.querySelector(".new-tab").addEventListener("click", () => {
      window.open(window.location.href, "_blank");
    });
    document.getElementById("more").addEventListener("click", () => showStatus("Qytrix start page"));
    address.addEventListener("input", () => { query.value = address.value; });
    query.addEventListener("input", () => { address.value = query.value; });
    query.focus();
  </script>
</body>
</html>
