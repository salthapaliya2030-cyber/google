<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#202124">
  <title>Google</title>
  <link rel="icon" href="https://www.google.com/favicon.ico">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body {
      min-height: 100vh; background: #202124; color: #e8eaed;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 24px; overflow: hidden;
    }
    .logo {
      font-size: clamp(3.5rem, 10vw, 5rem); font-weight: 600;
      margin-bottom: 34px; letter-spacing: -3px; user-select: none;
      animation: fadeIn .7s ease both;
    }
    .logo span:nth-child(1) { color: #4285f4; }
    .logo span:nth-child(2) { color: #ea4335; }
    .logo span:nth-child(3) { color: #fbbc05; }
    .logo span:nth-child(4) { color: #4285f4; }
    .logo span:nth-child(5) { color: #34a853; }
    .logo span:nth-child(6) { color: #ea4335; }
    .search-box {
      width: 100%; max-width: 590px; min-height: 54px;
      display: flex; align-items: center; gap: 13px;
      background: #303134; border: 1px solid #5f6368;
      border-radius: 30px; padding: 0 19px;
      transition: background .2s, box-shadow .2s, border-color .2s;
      animation: fadeIn .8s ease both;
    }
    .search-box:hover, .search-box:focus-within {
      background: #3c4043; border-color: transparent;
      box-shadow: 0 2px 10px rgba(0,0,0,.35);
    }
    .search-icon { width: 19px; height: 19px; flex-shrink: 0; color: #9aa0a6; }
    input {
      flex: 1; min-width: 0; background: transparent; border: none;
      outline: none; color: #e8eaed; font-size: 16px; height: 50px;
    }
    input::placeholder { color: #9aa0a6; }
    .buttons {
      margin-top: 28px; display: flex; gap: 12px;
      flex-wrap: wrap; justify-content: center;
      animation: fadeIn .9s ease both;
    }
    button {
      background: #303134; border: 1px solid #303134;
      border-radius: 5px; color: #e8eaed; font-size: 14px;
      padding: 11px 17px; cursor: pointer;
      transition: background .18s, border-color .18s, transform .18s;
    }
    button:hover { border-color: #5f6368; background: #3c4043; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 2px solid #8ab4f8; outline-offset: 3px; }
    .hint { color: #9aa0a6; font-size: 12px; margin-top: 26px; animation: fadeIn 1s ease both; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 480px) {
      .logo { margin-bottom: 28px; }
      .buttons { gap: 9px; }
      button { padding: 10px 13px; font-size: 13px; }
      .hint { text-align: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="logo" aria-label="Google">
    <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>

  <form class="search-box" id="searchForm">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="m16 16 4 4"></path>
    </svg>
    <input type="text" id="queryInput" placeholder="Search Google or type a URL"
      autocomplete="off" autofocus aria-label="Search Google or type a URL">
  </form>

  <div class="buttons">
    <button type="button" id="searchBtn">Google Search</button>
    <button type="button" id="newTabBtn">Open in New Tab</button>
    <button type="button" id="blankBtn">Open in about:blank</button>
  </div>

  <div class="hint">Search the web or enter a website address</div>

  <script>
    const input = document.getElementById("queryInput");
    const form = document.getElementById("searchForm");
    const SUFFIX = "/?://blooket.com";

    if (window.location.href === "about:blank") {
      document.getElementById("blankBtn").style.display = "none";
    }

    function buildDestination(rawInput) {
      const text = rawInput.trim();
      if (!text) return "";

      const looksLikeUrl = !/\s/.test(text) &&
        /^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+/.test(text);

      if (looksLikeUrl) {
        let url = text;
        if (!/^https?:\/\//i.test(url)) url = "https://" + url;
        return url.replace(/\/+$/, "") + SUFFIX;
      }

      return "https://www.google.com/search?q=" + encodeURIComponent(text);
    }

    function handleLaunch(newTab = false) {
      const destination = buildDestination(input.value);
      if (!destination) { input.focus(); return; }

      if (newTab) window.open(destination, "_blank", "noopener,noreferrer");
      else window.location.assign(destination);
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      handleLaunch(false);
    });

    document.getElementById("searchBtn").addEventListener("click", () => handleLaunch(false));
    document.getElementById("newTabBtn").addEventListener("click", () => handleLaunch(true));

    document.getElementById("blankBtn").addEventListener("click", () => {
      const win = window.open("about:blank", "_blank");
      if (!win) {
        alert("Pop-up blocked. Allow pop-ups and try again.");
        return;
      }
      const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      win.document.open();
      win.document.write(htmlContent);
      win.document.close();
    });
  </script>
</body>
</html>
